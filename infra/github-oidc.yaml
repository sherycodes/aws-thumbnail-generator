AWSTemplateFormatVersion: 2010-09-09
Description: >
  One-time bootstrap: GitHub OIDC provider + a deploy role for GitHub Actions.

Parameters:
  GitHubOrg:
    Type: String
    Description: Your GitHub username or organization
  RepoName:
    Type: String
    Description: Repository name
  BranchName:
    Type: String
    Default: main
  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: >
      The CDK bootstrap qualifier. hnb659fds is the default and is what you
      get unless you passed --qualifier to `cdk bootstrap`.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: thumbnail-generator-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}*/${RepoName}*:ref:refs/heads/${BranchName}"
      Policies:
        - PolicyName: AssumeCdkBootstrapRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-image-publishing-role-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-lookup-role-${AWS::AccountId}-${AWS::Region}"

Outputs:
  DeployRoleArn:
    Description: Store this as the repo secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
